name: Phase 3 - Verify and Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android files
        run: flutter create --platforms=android .

      - name: Restore project files overwritten by flutter create
        run: git checkout -- analysis_options.yaml test/widget_test.dart

      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          p.write_text(s)
          PY

      - name: Install N.G.N. Android app icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open("assets/branding/ngn_app_icon.png").convert("RGB")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          base = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              out = base / folder
              out.mkdir(parents=True, exist_ok=True)
              icon = src.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGB", (size, size), "white")
              canvas.paste(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.save(out / "ic_launcher.png", "PNG")
          PY

      - name: Prepare Bible data
        run: bash scripts/prepare_bible_data.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AAB
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ngn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ngn-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
