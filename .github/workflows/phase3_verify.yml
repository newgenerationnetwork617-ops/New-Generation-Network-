name: Phase 3 - Verify and Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android files
        run: flutter create --platforms=android .

      - name: Restore project files overwritten by flutter create
        run: git checkout -- analysis_options.yaml test/widget_test.dart

      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          p.write_text(s)
          PY

      - name: Install icon image tooling
        run: python3 -m pip install --quiet Pillow

      - name: Apply N.G.N. Android app icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open("assets/branding/app_icon.jpg").convert("RGB")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              out = Path("android/app/src/main/res") / folder
              out.mkdir(parents=True, exist_ok=True)
              src.resize((size, size), Image.Resampling.LANCZOS).save(out / "ic_launcher.png", "PNG")
          PY

      - name: Prepare Bible data
        run: bash scripts/prepare_bible_data.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ngn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
