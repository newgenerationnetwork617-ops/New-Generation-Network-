name: Phase 3 - Verify Bible and App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android files
        run: flutter create --platforms=android .

      - name: Restore project files overwritten by flutter create
        run: git checkout -- analysis_options.yaml test/widget_test.dart

      - name: Prepare Bible data
        run: bash scripts/prepare_bible_data.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
