name: Phase 3 - Verify and Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android files
        run: flutter create --platforms=android .

      - name: Configure NGN devotional home-screen widget
        run: python3 scripts/configure_devotional_widget.py

      - name: Configure Firebase for Android
        run: |
          test -f google-services.json || (echo "google-services.json is missing from the repository root" && exit 1)
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings_candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          app_candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          settings = next((p for p in settings_candidates if p.exists()), None)
          app_gradle = next((p for p in app_candidates if p.exists()), None)
          if settings is None or app_gradle is None:
              raise SystemExit("Generated Android Gradle files were not found")

          settings_text = settings.read_text()
          app_text = app_gradle.read_text()
          kotlin_dsl = settings.suffix == ".kts"

          if "com.google.gms.google-services" not in settings_text:
              if "plugins {" not in settings_text:
                  raise SystemExit("Android settings plugins block was not found")
              declaration = ('    id("com.google.gms.google-services") version "4.4.4" apply false\n'
                             if kotlin_dsl else
                             "    id 'com.google.gms.google-services' version '4.4.4' apply false\n")
              settings_text = settings_text.replace("plugins {", "plugins {\n" + declaration, 1)

          if "com.google.gms.google-services" not in app_text:
              if "plugins {" not in app_text:
                  raise SystemExit("Android app plugins block was not found")
              application_plugin = ('    id("com.google.gms.google-services")\n'
                                    if app_gradle.suffix == ".kts" else
                                    "    id 'com.google.gms.google-services'\n")
              app_text = app_text.replace("plugins {", "plugins {\n" + application_plugin, 1)

          settings.write_text(settings_text)
          app_gradle.write_text(app_text)
          print("Firebase Google Services plugin configured")
          PY

      - name: Restore project files overwritten by flutter create
        run: git checkout -- analysis_options.yaml test/widget_test.dart

      - name: Set Android permissions, app display name, and Google sign-in deep link
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
              '<uses-permission android:name="android.permission.VIBRATE"/>'
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          s, count = re.subn(r'android:label="[^"]*"', 'android:label="Holy World [NGN]"', s, count=1)
          if count == 0:
              s = s.replace('<application', '<application\n        android:label="Holy World [NGN]"', 1)
          deep_link = """
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="ngncommunity" android:host="login-callback" />
              </intent-filter>
          """
          if 'android:scheme="ngncommunity"' not in s:
              s = s.replace('</activity>', deep_link + '\n        </activity>', 1)
          receivers = """
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          """
          if "com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" not in s:
              s = s.replace("</application>", receivers + "\n    </application>")
          p.write_text(s)
          PY

      - name: Configure Android scheduled notification support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle.read_text()
          kotlin_dsl = gradle.suffix == ".kts"

          if kotlin_dsl:
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      content,
                      count=1,
                  )
                  if count == 0:
                      raise SystemExit("Could not locate compileOptions block")
              if "multiDexEnabled" not in content:
                  content, count = re.subn(
                      r"defaultConfig\s*\{",
                      "defaultConfig {\n        multiDexEnabled = true",
                      content,
                      count=1,
                  )
                  if count == 0:
                      raise SystemExit("Could not locate defaultConfig block")
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if "coreLibraryDesugaringEnabled" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      content,
                      count=1,
                  )
                  if count == 0:
                      raise SystemExit("Could not locate compileOptions block")
              if "multiDexEnabled" not in content:
                  content, count = re.subn(
                      r"defaultConfig\s*\{",
                      "defaultConfig {\n        multiDexEnabled true",
                      content,
                      count=1,
                  )
                  if count == 0:
                      raise SystemExit("Could not locate defaultConfig block")
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if dependency not in content:
              if "dependencies {" in content:
                  content = content.replace("dependencies {", "dependencies {\n    " + dependency, 1)
              else:
                  content += "\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(content)
          print(f"Configured scheduled notifications in {gradle}")
          PY

      - name: Install N.G.N. Android app icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open("assets/branding/ngn_app_icon-3.png").convert("RGB")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          base = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              out = base / folder
              out.mkdir(parents=True, exist_ok=True)
              icon = src.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGB", (size, size), "white")
              canvas.paste(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.save(out / "ic_launcher.png", "PNG")
          PY

      - name: Prepare Bible data
        run: bash scripts/prepare_bible_data.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AAB
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ngn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ngn-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
