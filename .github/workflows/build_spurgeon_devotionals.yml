name: Prepare Spurgeon Morning Devotionals

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_spurgeon_devotionals.py"
      - ".github/workflows/build_spurgeon_devotionals.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and prepare dated readings
        run: python scripts/build_spurgeon_devotionals.py

      - name: Commit prepared devotional data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/devotionals/spurgeon-morning/
          if git diff --cached --quiet; then
            echo "No devotional data changes to commit."
          else
            git commit -m "Add scheduled Spurgeon morning devotionals"
            git push
          fi
