name: new_generation_network
description: New Generation Network Christian ministry mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1
  http: ^1.6.0
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  record: ^6.2.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bible/books/
    - assets/devotionals/spurgeon-morning/
    - assets/word_of_day/
    - assets/branding/ngn_team_logo.png
    - assets/branding/ngn_app_icon_new.png
